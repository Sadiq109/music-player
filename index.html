<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="player" aria-label="Music player">
    <div class="art" aria-hidden="true">
      <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <h1 id="title">-</h1>
    <p id="artist" class="artist">-</p>

    <div class="progress">
      <span id="current">0:00</span>
      <input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek">
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffle" class="small" type="button" aria-pressed="false" aria-label="Shuffle" title="Shuffle">&#x1F500;</button>
      <button id="prev" type="button" aria-label="Previous track" title="Previous (p)">&#x23EE;</button>
      <button id="play" class="main" type="button" aria-label="Play or pause" title="Play/Pause (space)">
        <span class="icon-play">&#x25B6;</span><span class="icon-pause">&#x23F8;</span>
      </button>
      <button id="next" type="button" aria-label="Next track" title="Next (n)">&#x23ED;</button>
      <button id="repeat" class="small" type="button" data-mode="all" aria-label="Repeat: all" title="Repeat: all">&#x1F501;</button>
    </div>

    <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05"></label>
    <p id="status" class="status" role="status"></p>

    <ol id="playlist" class="playlist" aria-label="Playlist"></ol>
    <p class="keys">Space play/pause &middot; &larr; &rarr; seek 5s &middot; n / p next/previous</p>
  </main>
  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="src/app.js"></script>
</body>
</html>
